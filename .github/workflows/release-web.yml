name: Release Web

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-flutter

      - name: Verify pubspec version matches tag
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          VERSION="${TAG#v}"
          PUBSPEC_VERSION=$(grep '^version:' pubspec.yaml | awk '{print $2}' | cut -d'+' -f1)
          if [ "$PUBSPEC_VERSION" != "$VERSION" ]; then
            echo "Tag version ($VERSION) does not match pubspec version ($PUBSPEC_VERSION)"
            exit 1
          fi

      - name: Prepare release notes from CHANGELOG.md
        id: release_notes
        uses: ./.github/actions/release-notes

      - name: Build web release
        run: flutter build web --release

      - name: Package web bundle
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          cd build/web
          zip -r "../../gwc-web-${VERSION}.zip" .

      - name: Upload web bundle to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ steps.release_notes.outputs.release_name }}
          body_path: release-notes.md
          files: |
            gwc-web-*.zip
