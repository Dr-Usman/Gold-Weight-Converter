name: Release macOS

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-flutter

      - name: Verify pubspec version matches tag
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          VERSION="${TAG#v}"
          PUBSPEC_VERSION=$(grep '^version:' pubspec.yaml | awk '{print $2}' | cut -d'+' -f1)
          if [ "$PUBSPEC_VERSION" != "$VERSION" ]; then
            echo "Tag version ($VERSION) does not match pubspec version ($PUBSPEC_VERSION)"
            exit 1
          fi

      - name: Prepare release notes from CHANGELOG.md
        id: release_notes
        uses: ./.github/actions/release-notes

      - name: Build macOS app
        run: flutter build macos --release

      - name: Package macOS app
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          cd build/macos/Build/Products/Release
          ditto -c -k --sequesterRsrc --keepParent gold_weight_converter.app \
            "gwc-macos-${VERSION}.zip"

      - name: Upload macOS app to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ steps.release_notes.outputs.release_name }}
          body_path: release-notes.md
          files: |
            build/macos/Build/Products/Release/gwc-macos-*.zip
