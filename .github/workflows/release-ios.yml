name: Release iOS

on:
  workflow_dispatch:
# Signing secrets required before enabling tag builds:
#  push:
#    tags:
#      - 'v*'

permissions:
  contents: write

jobs:
  release-ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-flutter

      - name: Verify pubspec version matches tag
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          VERSION="${TAG#v}"
          PUBSPEC_VERSION=$(grep '^version:' pubspec.yaml | awk '{print $2}' | cut -d'+' -f1)
          if [ "$PUBSPEC_VERSION" != "$VERSION" ]; then
            echo "Tag version ($VERSION) does not match pubspec version ($PUBSPEC_VERSION)"
            exit 1
          fi

      - name: Prepare release notes from CHANGELOG.md
        id: release_notes
        uses: ./.github/actions/release-notes

      - name: Import code signing certificates
        uses: apple-actions/import-codesign-certs@v3
        with:
          p12-file-base64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
          p12-password: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          keychain-password: ${{ secrets.KEYCHAIN_PASSWORD }}

      - name: Install provisioning profile
        env:
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          if [ -z "$IOS_PROVISIONING_PROFILE_BASE64" ]; then
            echo "IOS_PROVISIONING_PROFILE_BASE64 secret is not set"
            exit 1
          fi
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo "$IOS_PROVISIONING_PROFILE_BASE64" | base64 -d > \
            ~/Library/MobileDevice/Provisioning\ Profiles/gwc.mobileprovision

      - name: Build signed IPA
        run: flutter build ipa --release

      - name: Rename IPA to match release naming
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          IPA_FILES=(build/ios/ipa/*.ipa)
          cp "${IPA_FILES[0]}" "build/ios/ipa/gwc-ios-${VERSION}.ipa"

      - name: Upload IPA to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ steps.release_notes.outputs.release_name }}
          body_path: release-notes.md
          files: |
            build/ios/ipa/gwc-ios-*.ipa
