name: Release Android

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-flutter

      - name: Verify pubspec version matches tag
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          VERSION="${TAG#v}"
          PUBSPEC_VERSION=$(grep '^version:' pubspec.yaml | awk '{print $2}' | cut -d'+' -f1)
          if [ "$PUBSPEC_VERSION" != "$VERSION" ]; then
            echo "Tag version ($VERSION) does not match pubspec version ($PUBSPEC_VERSION)"
            exit 1
          fi

      - name: Prepare release notes from CHANGELOG.md
        id: release_notes
        uses: ./.github/actions/release-notes

      - name: Decode Keystore & Key Properties
        # For Copy file to base64 (macOS): base64 -i key.properties | pbcopy
        run: |
          echo "${{ secrets.KEYPROPERTIES_BASE64 }}" | base64 --decode > android/key.properties
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/gwc_release_key.jks

      - name: Build signed universal and split APKs
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          ASSET_DIR="build/release-assets"
          mkdir -p "$ASSET_DIR"

          flutter build apk --release
          cp build/app/outputs/flutter-apk/app-release.apk \
            "$ASSET_DIR/gwc-android-${VERSION}-universal.apk"

          flutter build apk --release --split-per-abi
          for abi in arm64-v8a armeabi-v7a x86_64; do
            cp "build/app/outputs/flutter-apk/app-${abi}-release.apk" \
              "$ASSET_DIR/gwc-android-${VERSION}-${abi}.apk"
          done

      - name: Upload Android APKs to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ steps.release_notes.outputs.release_name }}
          body_path: release-notes.md
          files: |
            build/release-assets/gwc-android-*.apk
